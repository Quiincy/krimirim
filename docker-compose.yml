services:
  db:
    image: postgres:16-alpine
    container_name: krimirim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krimirim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krimirim_pass}
      POSTGRES_DB: ${POSTGRES_DB:-krimirim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krimirim} -d ${POSTGRES_DB:-krimirim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: krimirim_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-krimirim}:${POSTGRES_PASSWORD:-krimirim_pass}@db:5432/${POSTGRES_DB:-krimirim}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-krymirome}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-ChIJ2beS9OvF1EARn6h16WR3frs}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - uploads_data:/app/public/uploads
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:

